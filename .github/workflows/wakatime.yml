name: Atualizar Estatísticas do Wakatime

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write # <-- ESSA LINHA DÁ A PERMISSÃO DE ESCRITA QUE O GITHUB PEDE
    steps:
      - uses: actions/checkout@v4
      
      - uses: ImBIOS/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
