name: Atualizar Estatísticas do Wakatime

on:
  # Atualiza automaticamente todos os dias à meia-noite
  schedule:
    - cron: "0 0 * * *"
  
  # Permite que você clique em "Run workflow" para atualizar na hora
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Action oficial que gera os gráficos bonitos de horas e linguagens
      - uses: ImBIOS/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
